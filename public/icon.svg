<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reeflog logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0f3a47"/>
      <stop offset="55%" stop-color="#0b2029"/>
      <stop offset="100%" stop-color="#061319"/>
    </radialGradient>
    <linearGradient id="fish" x1="120" y1="150" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ff0e2"/>
      <stop offset="55%" stop-color="#3fe0d0"/>
      <stop offset="100%" stop-color="#1f8f88"/>
    </linearGradient>
    <linearGradient id="fin" x1="256" y1="120" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff7a6b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ambient bioluminescent bubbles -->
  <circle cx="150" cy="360" r="9" fill="#3fe0d0" opacity="0.5"/>
  <circle cx="185" cy="410" r="6" fill="#3fe0d0" opacity="0.35"/>
  <circle cx="360" cy="150" r="7" fill="#5ff0e2" opacity="0.4"/>

  <g filter="url(#glow)">
    <!-- tail fin -->
    <path d="M360 256c34-30 62-40 96-40-16 24-16 56 0 80-34 0-62-10-96-40z" fill="url(#fin)"/>
    <!-- body -->
    <path d="M120 256c40-72 116-112 200-96 30 6 54 22 68 40-14 18-38 34-68 40-84 16-160-24-200-96 40-72 116-112 200-96" fill="none"/>
    <ellipse cx="238" cy="256" rx="130" ry="86" fill="url(#fish)"/>
    <!-- top fin -->
    <path d="M210 172c22-40 58-58 96-52-14 22-30 40-52 54-16 8-32 6-44-2z" fill="url(#fin)" opacity="0.95"/>
    <!-- eye -->
    <circle cx="168" cy="238" r="15" fill="#061319"/>
    <circle cx="173" cy="233" r="5" fill="#eafcff"/>
  </g>

  <!-- wave baseline -->
  <path d="M96 372c40-26 80-26 120 0s80 26 120 0 80-26 120 0" stroke="#3fe0d0" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
</svg>
